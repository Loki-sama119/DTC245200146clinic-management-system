upstream backend_server {
    server backend:8000;
}

upstream frontend_server {
    server frontend:80;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost 127.0.0.1 192.168.220.131;

    client_max_body_size 20M;

    # ==========================================================================
    # SECURITY HEADERS (Linux Hardening & Gateway Protection)
    # ==========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src 'self' http: ws:;" always;

    # Phục vụ Static Files của Django Backend
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Reverse Proxy vào Backend API & OpenAPI Docs
    location /api/ {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Reverse Proxy vào Django Admin Portal
    location /admin/ {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Reverse Proxy vào Frontend SPA Application
    location / {
        proxy_pass http://frontend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
