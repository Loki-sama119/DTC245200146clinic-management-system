global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Prometheus Server Self-Metrics
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. cAdvisor (Container Resource Metrics: CPU, RAM, Network)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 3. PostgreSQL Exporter (DB Connections, Queries, Transactions)
  - job_name: 'postgres_exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # 4. Backend Application Metrics (Django / REST API)
  - job_name: 'clinic_backend'
    metrics_path: '/api/metrics/'
    static_configs:
      - targets: ['backend:8000']
