# ==============================================================================
# CLINIC MANAGEMENT SYSTEM — DOCKER COMPOSE ORCHESTRATION
# Học phần: Triển khai và Quản trị Hệ thống Phần mềm
# Đề tài: Đề 8 — Hệ thống Quản lý Phòng khám / Bệnh viện
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE TIER: PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: clinic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinic_db}
      POSTGRES_USER: ${POSTGRES_USER:-clinic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic_secure_password_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - clinic_pgdata:/var/lib/postgresql/data/pgdata
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinic_user} -d ${POSTGRES_DB:-clinic_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. DATABASE MANAGEMENT: pgAdmin 4
  # ----------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8.4
    container_name: clinic_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@phucanclinic.vn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-Admin@Clinic2026}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    volumes:
      - clinic_pgadmin_data:/var/lib/pgadmin
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. BACKEND TIER: Django + Gunicorn WSGI
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinic_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_logs:/app/logs
    networks:
      - backend_net
      - frontend_net
      - monitoring_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health/\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 4. FRONTEND TIER: React + Vite SPA
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clinic_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - frontend_net
    depends_on:
      backend:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 5. REVERSE PROXY & GATEWAY: Nginx
  # ----------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: clinic_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - backend_static:/var/www/static:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend_net
      - monitoring_net
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 6. MONITORING: PostgreSQL Exporter
  # ----------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: clinic_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-clinic_user}:${POSTGRES_PASSWORD:-clinic_secure_password_2026}@postgres:5432/${POSTGRES_DB:-clinic_db}?sslmode=disable"
    networks:
      - backend_net
      - monitoring_net
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 7. MONITORING: cAdvisor (Container Metrics)
  # ----------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: clinic_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - monitoring_net

  # ----------------------------------------------------------------------------
  # 8. MONITORING: Prometheus Server
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: clinic_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - clinic_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - monitoring_net
    depends_on:
      - postgres-exporter
      - cadvisor

  # ----------------------------------------------------------------------------
  # 9. MONITORING: Grafana Visualization
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: clinic_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-Admin@Grafana2026}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - clinic_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring_net
    depends_on:
      - prometheus
      - loki

  # ----------------------------------------------------------------------------
  # 10. CENTRALIZED LOGGING: Grafana Loki
  # ----------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.4
    container_name: clinic_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - clinic_loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring_net

  # ----------------------------------------------------------------------------
  # 11. LOG SHIPPER: Promtail
  # ----------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.4
    container_name: clinic_promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - backend_logs:/var/log/backend:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring_net
    depends_on:
      - loki

# ------------------------------------------------------------------------------
# ISOLATED NETWORKS (Hardening: Network Isolation)
# ------------------------------------------------------------------------------
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  monitoring_net:
    driver: bridge

# ------------------------------------------------------------------------------
# PERSISTENT VOLUMES
# ------------------------------------------------------------------------------
volumes:
  clinic_pgdata:
  clinic_pgadmin_data:
  clinic_grafana_data:
  clinic_prometheus_data:
  clinic_loki_data:
  backend_static:
  backend_logs:
  nginx_logs:
